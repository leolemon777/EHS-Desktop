<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#EDF2F7" />
    <title>净水工厂 EHS · 环境健康安全管理</title>
    <link rel="icon" type="image/png" href="assets/images/brand-icon.png" />
    <link rel="stylesheet" href="cirrus/css/system.css" />
    <link rel="stylesheet" href="assets/app.css" />
    <script src="https://unpkg.com/lucide@0.511.0"></script>
  </head>
  <body class="sky">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <a class="brand" href="#overview" aria-label="净水工厂 EHS 首页">
          <span class="brand__mark" aria-hidden="true">
            <img class="brand__mark-img" src="assets/images/brand-icon.png" alt="" width="36" height="36" />
          </span>
          <span>
            <strong>净水工厂 EHS</strong>
            <small>安全管理中心</small>
          </span>
        </a>

        <nav class="side-nav">
          <p class="side-nav__label">工作台</p>
          <a class="side-nav__item is-active" href="#overview" data-route="overview">
            <span class="side-nav__icon"><i data-lucide="layout-grid"></i></span><span>管理总览</span>
          </a>
          <p class="side-nav__label">业务管理</p>
          <a class="side-nav__item" href="#tools" data-route="tools">
            <span class="side-nav__icon"><i data-lucide="wrench"></i></span><span>手持电动工具</span><b data-nav-count="tools" hidden></b>
          </a>
          <a class="side-nav__item" href="#inspections" data-route="inspections">
            <span class="side-nav__icon"><i data-lucide="clipboard-list"></i></span><span>工具巡检</span><b data-nav-count="inspections" hidden></b>
          </a>
          <a class="side-nav__item" href="#energy" data-route="energy">
            <span class="side-nav__icon"><i data-lucide="zap"></i></span><span>能源数据</span>
          </a>
          <a class="side-nav__item" href="#certificates" data-route="certificates">
            <span class="side-nav__icon"><i data-lucide="id-card"></i></span><span>人员证件</span><b data-nav-count="certificates" hidden></b>
          </a>
          <a class="side-nav__item" href="#waste" data-route="waste">
            <span class="side-nav__icon"><i data-lucide="recycle"></i></span><span>危废存量</span><b data-nav-count="waste" hidden></b>
          </a>
          <a class="side-nav__item" href="#chemicals" data-route="chemicals">
            <span class="side-nav__icon"><i data-lucide="flask-conical"></i></span><span>化学品管理</span>
          </a>
        </nav>

        <div class="sidebar__footer">
          <div class="progress-card">
            <span class="chip"><i data-lucide="shield-check" class="icon"></i> 合规进度</span>
            <strong>尚未配置合规任务</strong>
            <div class="progress-track"><span style="width: 0"></span></div>
            <small>等待录入真实业务数据</small>
          </div>
          <button class="user-card" type="button">
            <span class="avatar">安</span>
            <span><strong>安全管理员</strong><small>EHS 管理员</small></span>
            <i data-lucide="more-horizontal"></i>
          </button>
        </div>
      </aside>

      <button class="sidebar-scrim" id="sidebarScrim" aria-label="关闭导航"></button>

      <main class="main-shell">
        <header class="topbar">
          <button class="icon-btn mobile-only" id="menuButton" type="button" aria-label="打开导航">
            <i data-lucide="menu"></i>
          </button>
          <div class="global-search">
            <i data-lucide="search" aria-hidden="true"></i>
            <input id="globalSearch" type="search" placeholder="搜索人员、工具、化学品..." autocomplete="off" aria-label="全局搜索" aria-expanded="false" aria-controls="searchPanel" />
            <button class="search-clear" id="searchClearButton" type="button" aria-label="清除搜索" hidden><i data-lucide="x"></i></button>
            <kbd>Ctrl K</kbd>
            <div class="search-panel" id="searchPanel" hidden></div>
          </div>
          <div class="topbar__actions">
            <span class="sync-state"><i data-lucide="badge-check"></i> 本地数据已保存</span>
            <button class="icon-btn" id="helpButton" type="button" aria-label="帮助" aria-expanded="false"><i data-lucide="circle-help"></i></button>
            <button class="icon-btn" id="notificationButton" type="button" aria-label="通知" aria-expanded="false"><i data-lucide="bell"></i></button>
            <button class="btn btn-primary" id="quickAddButton" type="button">
              <i data-lucide="plus" class="icon"></i><span>新增记录</span>
            </button>
            <section class="top-popover" id="notificationPanel" aria-label="通知中心" hidden>
              <header><div><h2>需要你处理</h2></div><button class="panel-close" type="button" data-close-popover aria-label="关闭通知"><i data-lucide="x"></i></button></header>
              <div class="notification-empty">
                <i data-lucide="bell-off"></i>
                <strong>当前没有待处理通知</strong>
                <small>录入真实业务数据后，提醒会显示在这里。</small>
              </div>
            </section>
            <section class="top-popover help-popover" id="helpPanel" aria-label="快捷帮助" hidden>
              <header><div><h2>操作提示</h2></div><button class="panel-close" type="button" data-close-popover aria-label="关闭帮助"><i data-lucide="x"></i></button></header>
              <div class="shortcut-list">
                <span><kbd>Ctrl</kbd><kbd>K</kbd><strong>打开全局搜索</strong></span>
                <span><kbd>Esc</kbd><strong>关闭当前浮层</strong></span>
                <span><i data-lucide="badge-check"></i><strong>新增与编辑自动保存在本机</strong></span>
              </div>
            </section>
          </div>
        </header>

        <div class="page-content" id="pageContent" aria-live="polite"></div>
      </main>
    </div>

    <div class="modal-backdrop" id="recordModal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <header class="modal__header">
          <div>
            <h2 id="modalTitle">新增记录</h2>
          </div>
          <button class="icon-btn" id="closeModalButton" type="button" aria-label="关闭弹窗">
            <i data-lucide="x"></i>
          </button>
        </header>
        <form id="recordForm">
          <div class="modal__body" id="modalFields"></div>
          <footer class="modal__footer">
            <button class="btn btn-ghost" id="cancelModalButton" type="button">取消</button>
            <button class="btn btn-primary" type="submit"><i data-lucide="check" class="icon"></i> 保存记录</button>
          </footer>
        </form>
      </section>
    </div>

    <div class="drawer-backdrop" id="detailBackdrop" hidden></div>
    <aside class="detail-drawer" id="detailDrawer" aria-labelledby="detailTitle" aria-hidden="true" inert hidden>
      <header class="detail-drawer__header">
        <div><h2 id="detailTitle">记录详情</h2></div>
        <button class="icon-btn" id="closeDetailButton" type="button" aria-label="关闭详情"><i data-lucide="x"></i></button>
      </header>
      <div class="detail-drawer__body" id="detailBody"></div>
      <footer class="detail-drawer__footer">
        <button class="btn btn-secondary danger-button" id="deleteRecordButton" type="button"><i data-lucide="trash-2" class="icon"></i> 删除</button>
        <button class="btn btn-secondary" id="printRecordButton" type="button" hidden><i data-lucide="printer" class="icon"></i> 打印表格</button>
        <button class="btn btn-primary" id="editRecordButton" type="button"><i data-lucide="pencil" class="icon"></i> 编辑记录</button>
      </footer>
    </aside>

    <div class="modal-backdrop" id="confirmModal" hidden>
      <section class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
        <span class="confirm-card__icon"><i data-lucide="triangle-alert"></i></span>
        <h2 id="confirmTitle">确认删除这条记录？</h2>
        <p id="confirmMessage">删除后仍可在短时间内撤销。</p>
        <div class="confirm-card__actions">
          <button class="btn btn-secondary" id="cancelDeleteButton" type="button">取消</button>
          <button class="btn danger-primary" id="confirmDeleteButton" type="button"><i data-lucide="trash-2" class="icon"></i> 确认删除</button>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span class="toast__icon"><i data-lucide="check"></i></span>
      <span><strong id="toastTitle">保存成功</strong><small id="toastMessage">记录已写入本地数据</small></span>
      <button class="toast__action" id="toastAction" type="button" hidden>撤销</button>
    </div>

    <div class="print-area" id="printArea" aria-hidden="true"></div>

    <script src="assets/app.js"></script>
  </body>
</html>
